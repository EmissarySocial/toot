name: Gosec
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  GOFLAGS: "-buildvcs=false"

jobs:

  gosec:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # gosec needs Go 1.25, and setup-go sets GOTOOLCHAIN=local, so this module's
    # older go directive would fail the install instead of downloading.  See go-quality ci.md.
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.25.x"

    - name: Install Gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

    # Suppressions live inline as `// #nosec <rule> -- <reason>`, never in a config file, so
    # the justification sits beside the code a reviewer is reading.  See go-hardening.
    - name: Security lint
      run: gosec ./...
